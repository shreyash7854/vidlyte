name: MA debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: reader and bigbang probe
        run: |
          set -e
          probe() {
            label="$1"; url="$2"; shift 2
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w "%{http_code}" --max-time 30 "$@" "$url" || true)
            bytes=$(wc -c < "$out")
            head=$(head -c 120 "$out" | tr '\n' ' ')
            echo "probe=$label status=$code bytes=$bytes head=$head"
          }
          probe jina-text "https://r.jina.ai/https://embed.vidrift.net/api/boot/tv/314939/1/2" -H "X-Return-Format: text"
          probe jina-default "https://r.jina.ai/https://embed.vidrift.net/api/boot/tv/314939/1/2"
          probe bigbang-unsigned "https://norway-canary.bigbang.cymru/origin_tv/tv/tmdb-314939/S01E02/index.m3u8.png"
          probe bigbang-plain "https://norway-canary.bigbang.cymru/origin_tv/tv/tmdb-314939/S01E02/index.m3u8"
