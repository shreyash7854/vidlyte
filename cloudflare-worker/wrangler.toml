name = "vid"
main = "src/index.js"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Secrets are NOT stored here. Set them once with:
#   npx wrangler secret put HMAC_SECRET
#   npx wrangler secret put ADMIN_SECRET
# Keeping them out of [vars] means `wrangler deploy` can never overwrite them.
ADMIN_ROUTE = "/vly-ops-7x"
DEFAULT_TTL_SEC = 900
SWARM_NODES = ""
# Bind playback tokens to the requesting client IP. Leave false when viewers
# may switch networks mid-playback (mobile handoff).
BIND_CLIENT_IP = "false"
# Comma-separated extra upstream host suffixes allowed by /proxy and the
# resolver guards. Built-in provider hosts are always allowed.
UPSTREAM_ALLOWLIST = ""
# Phase 3 abuse control (per-IP, fixed 60s window, per isolate). Set
# RATE_LIMIT_ENABLED="false" to disable. Media covers HLS/segments.
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_PER_MINUTE = "240"
RATE_LIMIT_API_PER_MINUTE = "120"
RATE_LIMIT_MEDIA_PER_MINUTE = "1800"
RATE_LIMIT_ADMIN_PER_MINUTE = "40"

# Phase 5: admin session lifetime (seconds). Default 12h, capped at 7 days.
ADMIN_SESSION_TTL_SEC = "43200"
# Ops feeds published by GitHub Actions (quota/watchdog/sweep JSON). The Worker
# reads https://raw.githubusercontent.com/<owner>/<repo>/ops-<kind>/<kind>.json
# and caches the combined snapshot in CONFIG_KV. Public, non-secret data only.
OPS_STATUS_BASE = "https://raw.githubusercontent.com/shreyash7854/vidlyte"
# Optional webhook (Slack/Discord/JSON) notified when scheduled maintenance
# finds an unhealthy swarm node or provider. Empty disables alerting.
ALERT_WEBHOOK_URL = ""

# Telegram alerting. The bot token and chat id are secrets:
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
TELEGRAM_ALERTS_ENABLED = "true"
ALERT_MIN_SEVERITY = "warning"
ALERT_COOLDOWN_MIN = "15"
# A transient probe miss must not page the owner. Providers alert only after
# this many consecutive scheduled failures; the canary after this many full-chain
# misses. Recovery is sent only when every raw signal is healthy again.
PROVIDER_ALERT_MIN_FAILURES = "2"
CANARY_ALERT_MIN_FAILURES = "2"

# Self-healing canary. Scheduled maintenance resolves this asset through a
# Worker-reachable provider and validates the manifest. Readiness fails when a
# stored canary is failed or stale. `?canary=1` forces a live check.
WATCHDOG_CANARY_ENABLED = "true"
WATCHDOG_CANARY_ASSET = "tv/66732/1/1"
WATCHDOG_CANARY_PROVIDER = "framextv"
WATCHDOG_CANARY_MAX_AGE_SEC = "1800"
WATCHDOG_REQUIRE_CANARY = "false"
# Fallbacks keep one upstream flake from paging the owner. The canary tries the
# configured provider/asset first, then these assets, then these providers.
WATCHDOG_CANARY_FALLBACK_ASSETS = "movie/550"
WATCHDOG_CANARY_FALLBACK_PROVIDERS = "2vcdn"

# Multi-audio resolver. Cloudflare egress to vidrift is blocked by an edge
# challenge, so the Worker dispatches a GitHub Actions workflow that resolves
# the signed BigBang URL from outside the block and posts it back over an
# HMAC-signed endpoint. Secrets (never in [vars]):
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
#   npx wrangler secret put MULTI_AUDIO_PUBLISH_KEY
GITHUB_REPO = "shreyash7854/vidlyte"
MULTI_AUDIO_WORKFLOW = "multi-audio-resolve.yml"
GITHUB_DISPATCH_REF = "main"

# Optional persistent configuration store. Without it the admin panel still
# works, but runtime config is per-isolate and resets on cold starts.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "1458cc95d50b4ba99b31ea7b736b5e64"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

# Scheduled self-healing: probe swarm nodes and provider endpoints every 15
# minutes. Free accounts support up to 5 cron triggers.
[triggers]
crons = ["*/15 * * * *"]
